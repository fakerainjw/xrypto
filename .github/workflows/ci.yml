name: ci

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "data/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Lint
        run: |
          uv run ruff check
          uv run ruff format --check src tests

      - name: Test
        run: uv run pytest -q
